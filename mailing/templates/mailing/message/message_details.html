{% extends 'mailing/base.html' %}

{% block title %}Главная{% endblock %}

{% block content %}
{% if message.author == user %}
<h1> Информация о сообщении </h1>
{{ message.subject }}
{{ message.letter }}
<a href="{% url 'mailing:update_message' message.pk %}" class="btn btn-primary">Изменить</a>
<a href="{% url 'mailing:delete_message' message.pk %}" class="btn btn-danger">Удалить</a>
{% else %}
<h2>У вас нет доступа к этому сообщению</h2>
{% endif %}
{% endblock %}
