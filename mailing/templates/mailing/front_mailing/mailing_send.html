{% extends 'mailing/base.html' %}

{% block title %}Главная{% endblock %}

{% block content %}
<h1>Рассылка {{ mailing.id }}</h1>
<p>Статус: {{ mailing.get_status_display }}</p>
<p>Сообщение: {{ mailing.message.subject }}</p>
<p>Получатели: {{ mailing.recipients.count }}</p>

<form method="post" action="{% url 'mailing:mailing_send' pk=mailing.id %}">
  {% csrf_token %}
  <button type="submit">Отправить рассылку</button>
</form>
{% endblock %}
